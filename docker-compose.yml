services:
  postgresql:
    image: postgres:16
    container_name: carrental_postgresql
    ports:
      - "54321:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: carrental_docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fahmi123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carrental_docker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-express
      dockerfile: Docker/Dockerfile.nginx.staging
    container_name: carrental-backend
    ports:
      - "1004:80"
    restart: unless-stopped
    env_file:
      - ./backend-express/.env
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./backend-express:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Docker/Dockerfile.nginx.staging
    container_name: carrental-frontend
    restart: unless-stopped
    ports:
      - "2004:80"
    depends_on:
      - backend

volumes:
  backend_node_modules:
  postgres_data:
